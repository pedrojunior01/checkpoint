name: SaveVault CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build, Lint and Test (Windows GNU)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Windows Environment
        run: |
          New-Item -ItemType Directory -Force -Path "C:\svt"
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-gnu

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Check workspace compilation
        run: cargo check --workspace --all-targets

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --verbose

