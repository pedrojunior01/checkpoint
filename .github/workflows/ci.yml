name: SaveVault CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_AR: ar.exe

jobs:
  test:
    name: Build, Lint and Test (Windows GNU)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Configure Windows Environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\svt"
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if ($msys -and (Test-Path "$msys\mingw64")) {
            New-Item -ItemType Directory -Force -Path "C:\msys64"
            if (!(Test-Path "C:\msys64\mingw64")) {
              cmd /c mklink /J "C:\msys64\mingw64" "$msys\mingw64"
            }
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-gnu

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Check workspace compilation
        run: cargo check --workspace --all-targets

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --verbose

