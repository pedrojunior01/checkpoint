[package]
name = "savevault-app"
version.workspace = true
edition.workspace = true
default-run = "savevault"

[lib]
path = "src/lib.rs"

[[bin]]
name = "savevault"
path = "src/main.rs"

[[bin]]
name = "scan_report"
path = "src/bin/scan_report.rs"

[features]
# Feature 'desktop' habilita a GUI nativa via Tauri 2.
# Sem essa feature, o binário funciona normalmente como CLI/headless.
# Isso garante que 'cargo test --workspace' nunca precise do runtime gráfico.
desktop = ["tauri", "tauri-build"]

[dependencies]
savevault-core = { path = "../savevault-core" }
savevault-db = { path = "../savevault-db" }
savevault-discovery = { path = "../savevault-discovery" }
savevault-backup = { path = "../savevault-backup" }
savevault-monitor = { path = "../savevault-monitor" }
savevault-sync = { path = "../savevault-sync" }
savevault-cloud = { path = "../savevault-cloud" }

tokio = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
winrt-notification = "0.5.1"

# Tauri — só incluída quando a feature 'desktop' está ativa
tauri = { workspace = true, optional = true }

[build-dependencies]
# tauri-build só compila quando 'desktop' está ativa
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = "0.1"
