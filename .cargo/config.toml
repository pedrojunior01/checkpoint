# Configuração local do Cargo para o projeto SaveVault.
#
# IMPORTANTE: Este arquivo define a toolchain e o linker padrão para compilação
# no Windows sem precisar do MSVC (link.exe). Usa a toolchain GNU + MinGW64.
#
# Pré-requisitos (já instalados):
#   - rustup toolchain: stable-x86_64-pc-windows-gnu
#   - MinGW64 via MSYS2 em C:\msys64\mingw64\bin\
#
# Com este arquivo, basta rodar:
#   cargo test --workspace
#   cargo build
#   cargo run --bin savevault

# Configuração portátil do Cargo para o projeto SaveVault.
#
# Para builds no Windows com a toolchain GNU (x86_64-pc-windows-gnu),
# utiliza o linker gcc/ar disponíveis no PATH do sistema.
#
# Configurações específicas de máquina (como target-dir customizado ou
# caminhos absolutos de toolchain) devem ser definidas via variáveis
# de ambiente (ex: CARGO_TARGET_DIR) ou em configuração local do usuário.

[target.x86_64-pc-windows-gnu]
linker = "gcc"
ar     = "ar"

