# Configuração local do Cargo para o projeto SaveVault.
#
# Suporta tanto a toolchain MSVC (padrão no Windows) quanto MinGW/GNU:
# - MSVC: passa /STACK:16777216 ao link.exe para reservar 16 MB de stack
# - GNU:  passa -Wl,--stack,16777216 ao ld/gcc para reservar 16 MB de stack

[build]
target-dir = "C:/svt"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

[target.x86_64-pc-windows-gnu]
linker = "C:/msys64/mingw64/bin/gcc.exe"
ar     = "C:/msys64/mingw64/bin/ar.exe"
rustflags = ["-C", "link-arg=-Wl,--stack,16777216"]

